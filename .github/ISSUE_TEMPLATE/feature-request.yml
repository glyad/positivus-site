name: Feature request
description: Propose a focused improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or workflow should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the intended behavior, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: rtl
    attributes:
      label: English and Hebrew considerations
      description: Explain any copy, direction, or responsive implications.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
