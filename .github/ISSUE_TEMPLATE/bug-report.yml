name: Bug report
description: Report a reproducible Positivus defect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for providing a focused, reproducible report.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language and direction
      options:
        - English LTR
        - Hebrew RTL
        - Both
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and viewport
      placeholder: Safari 19, 1440 × 900
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
