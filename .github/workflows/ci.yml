name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install repository metadata
        run: npm ci

      - name: Audit package metadata
        run: npm audit --omit=dev

      - name: Run required checks
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Upload deployable build
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: positivus-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
