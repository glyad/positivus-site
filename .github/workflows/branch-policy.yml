name: Branch policy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: validate branch path
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enforce main → develop → feature flow
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            node scripts/branch-policy.mjs "$GITHUB_BASE_REF" "$GITHUB_HEAD_REF"
          else
            echo "Protected branch push recorded after GitHub branch-rule enforcement."
          fi
